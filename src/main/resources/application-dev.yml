spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/eventmeetup
    username: eventmeetup
    password: eventmeetup
  application:
    name: EventMeetup
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
server:
  port: 80
